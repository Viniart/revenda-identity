name: revenda-identity

services:
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_DB: revenda_identity
      POSTGRES_USER: ${POSTGRES_USER:-revenda}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-revenda}
    ports:
      - "5433:5432"
    volumes:
      - postgres-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-revenda} -d revenda_identity"]
      interval: 5s
      timeout: 3s
      retries: 10

  api:
    image: ${IMAGE:-revenda-identity:local}
    build: .
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      ConnectionStrings__Postgres: Host=postgres;Port=5432;Database=revenda_identity;Username=${POSTGRES_USER:-revenda};Password=${POSTGRES_PASSWORD:-revenda}
      Jwt__Issuer: ${JWT_ISSUER:-http://localhost:8081}
      Jwt__Audience: ${JWT_AUDIENCE:-revenda-vehicles}
      Jwt__PrivateKeyPem: ${JWT_PRIVATE_KEY_PEM:-}
      Administrator__Name: ${ADMIN_NAME:-Administrador da Revenda}
      Administrator__Cpf: ${ADMIN_CPF:-}
      Administrator__Email: ${ADMIN_EMAIL:-}
      Administrator__Password: ${ADMIN_PASSWORD:-}
    ports:
      - "8081:8080"
    healthcheck:
      test: ["CMD-SHELL", "wget -qO- http://localhost:8080/health || exit 1"]
      interval: 10s
      timeout: 3s
      retries: 5

volumes:
  postgres-data:
